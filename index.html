      onPointerCancel={() => { drag.current = null; }}

// ---------- KARAKTER EDİTÖRÜ ----------
const CharacterEditor = ({ initial, onSave, onCancel }) => {
  const [c, setC] = useState({ ...DEFAULT_CHAR, ...(initial || {}) });
  const [tab, setTab] = useState('hair');
  const [busy, setBusy] = useState(false);
  const set = (k, v) => setC(p => ({ ...p, [k]: v }));
  const rnd = (a) => a[Math.floor(Math.random() * a.length)];
  const random = () => setC({
    body: rnd(OPTS.body)[0], skin: rnd(SKINS), hair: rnd(OPTS.hair)[0], hairColor: rnd(HAIRC), face: rnd(OPTS.face)[0], beard: rnd(OPTS.beard)[0], beardColor: rnd(HAIRC),
    glasses: rnd(OPTS.glasses)[0], hat: rnd(OPTS.hat)[0], hatColor: rnd(COLORS), top: rnd(OPTS.top)[0], topColor: rnd(COLORS),
    bottom: rnd(OPTS.bottom)[0], bottomColor: rnd(COLORS), shoes: rnd(COLORS)
  });
  const cur = TABS.find(t => t.id === tab);
  return (
    <div className="space-y-3">
      <div className="rounded-3xl bg-gradient-to-b from-indigo-900/40 to-slate-900/60 border border-white/10">
        <Character3D char={c} scale={1.15} height={300} />
      </div>
      <div className="flex gap-2 overflow-x-auto pb-1 custom-scrollbar">
        {TABS.map(t => <button key={t.id} onClick={() => setTab(t.id)} className={`px-3 py-2 rounded-xl text-sm font-bold whitespace-nowrap ${tab === t.id ? 'bg-indigo-600' : 'bg-white/10'}`}>{t.label}</button>)}
      </div>
      <div className="space-y-3 bg-white/5 rounded-2xl p-3">
        {cur.secs.map(([key, label, palette]) => (
          <div key={key}>
            <div className="text-xs text-white/60 mb-1.5">{label}</div>
            <div className="flex flex-wrap gap-2">
              {palette
                ? palette.map(col => <button key={col} onClick={() => set(key, col)} style={{ background: col }} className={`w-8 h-8 rounded-full border-2 ${c[key] === col ? 'border-white scale-110' : 'border-white/20'}`} />)
                : OPTS[key].map(([v, l]) => <button key={v} onClick={() => set(key, v)} className={`px-3 py-1.5 rounded-lg text-sm ${c[key] === v ? 'bg-emerald-600 font-bold' : 'bg-white/10'}`}>{l}</button>)}
            </div>
          </div>
        ))}
      </div>
      <div className="flex gap-2">
        <button onClick={random} className="px-4 py-3 rounded-xl bg-white/10 font-bold">🎲 Rastgele</button>
        <button onClick={onCancel} className="px-4 py-3 rounded-xl bg-white/10 font-bold">Vazgeç</button>
        <button disabled={busy} onClick={async () => { setBusy(true); try { await onSave(c); } finally { setBusy(false); } }} className="flex-1 py-3 rounded-xl bg-emerald-600 font-bold">{busy ? 'Kaydediliyor…' : 'Kaydet'}</button>
      </div>
    </div>
  );
};

            courses["Matematik"] = { icon: <Calculator className="w-8 h-8" />, topics: BASE_TOPICS["Matematik"], color: "bg-blue-600/20 text-blue-400 border-blue-500/30 hover:border-blue-500" };

        const SHOP_ITEMS = [
            { id: 'boost', emoji: '⚡', label: '2x Puan (10 dk)', desc: '10 dakika boyunca kazandığın puanlar iki katı olur.', price: 600 },
            { id: 'shield', emoji: '🛡️', label: 'Can Kalkanı', desc: 'Bir yanlış cevapta puanın silinmez.', price: 400 },
            { id: 'time', emoji: '⏱️', label: 'Ekstra Süre', desc: 'Bir sonraki oyununda +15 saniye.', price: 300 },

        function RaceGame({ getQuestion, onPoints, penalty, onFinish, onRestart, onExit, onHome, extraTime, boost }) {
            const canvasRef = useRef(null);
            const S = useRef(null);
            const cb = useRef({});
            cb.current = { getQuestion, onPoints, penalty, onFinish, boost };
            const T0 = 75 + (extraTime ? 15 : 0);
            const [hud, setHud] = useState({ lives: 3, time: T0, net: 0, coins: 0 });
            const [q, setQ] = useState(null);
            const [fb, setFb] = useState(null);
            const [over, setOver] = useState(false);
            const W = 300, H = 440, LW = 100, carY = H - 90;

            const move = (d) => { const s = S.current; if (s && !s.paused && !s.over) s.lane = Math.max(0, Math.min(2, s.lane + d)); };

            useEffect(() => {
                S.current = { lane: 1, x: 150, obs: [], coins: [], speed: 2.6, spawn: 300, road: 0, paused: false, over: false, lives: 3, time: T0, net: 0, coinsN: 0, last: 0 };
                const cv = canvasRef.current; const ctx = cv.getContext('2d');
                let raf;
                const finish = () => { const s = S.current; s.over = true; setOver(true); cb.current.onFinish(); };
                const loop = (ts) => {
                    const s = S.current;
                    const dt = Math.min(40, ts - (s.last || ts)); s.last = ts;
                    if (!s.paused && !s.over) {
                        const f = dt / 16;
                        s.road = (s.road + s.speed * f * 1.6) % 40;
                        s.speed = Math.min(5, s.speed + dt * 0.00006);
                        s.x += (s.lane * LW + LW / 2 - s.x) * 0.25;
                        s.spawn -= dt;
                        if (s.spawn <= 0) {
                            const lane = Math.floor(Math.random() * 3);
                            if (Math.random() < 0.6) s.obs.push({ lane, y: -50 }); else s.coins.push({ lane, y: -30 });
                            s.spawn = 750 + Math.random() * 450 - s.speed * 40;
                        }
                        s.obs.forEach(o => { o.y += s.speed * f * 1.6; });
                        s.coins.forEach(c => { c.y += s.speed * f * 1.6; });
                        for (const o of s.obs) {
                            if (!o.hit && o.lane === s.lane && o.y > carY - 40 && o.y < carY + 60) {
                                o.hit = true; s.paused = true; setFb(null); setQ(cb.current.getQuestion());
                            }
                        }
                        s.coins = s.coins.filter(c => {
                            if (c.lane === s.lane && c.y > carY - 30 && c.y < carY + 60) {
                                s.coinsN += 1; s.net += cb.current.boost ? 4 : 2; cb.current.onPoints(2);
                                setHud(h => ({ ...h, coins: s.coinsN, net: s.net }));
                                return false;
                            }
                            return c.y < H + 40;
                        });
                        s.obs = s.obs.filter(o => o.hit || o.y < H + 60);
                    }
                    ctx.clearRect(0, 0, W, H);
                    ctx.fillStyle = '#1f2937'; ctx.fillRect(0, 0, W, H);
                    ctx.fillStyle = '#facc15'; ctx.fillRect(0, 0, 4, H); ctx.fillRect(W - 4, 0, 4, H);
                    ctx.fillStyle = '#e5e7eb';
                    for (let y = -40 + s.road; y < H; y += 40) { ctx.fillRect(LW - 2, y, 4, 22); ctx.fillRect(2 * LW - 2, y, 4, 22); }
                    s.coins.forEach(c => { const cx = c.lane * LW + LW / 2; ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(cx, c.y, 12, 0, 6.3); ctx.fill(); ctx.fillStyle = '#92400e'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('★', cx, c.y + 5); });
                    s.obs.forEach(o => { if (o.hit) return; const ox = o.lane * LW + LW / 2; ctx.fillStyle = '#6b7280'; ctx.beginPath(); ctx.arc(ox, o.y, 24, 0, 6.3); ctx.fill(); ctx.fillStyle = '#374151'; ctx.beginPath(); ctx.arc(ox - 7, o.y - 6, 8, 0, 6.3); ctx.fill(); ctx.fillStyle = '#ef4444'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('?', ox + 6, o.y + 8); });
                    const cx = s.x;
                    ctx.fillStyle = '#ef4444'; ctx.fillRect(cx - 19, carY, 38, 66);
                    ctx.fillStyle = '#fca5a5'; ctx.fillRect(cx - 19, carY + 4, 38, 6);
                    ctx.fillStyle = '#0f172a'; ctx.fillRect(cx - 14, carY + 16, 28, 16); ctx.fillRect(cx - 14, carY + 44, 28, 10);
                    ctx.fillStyle = '#111827'; ctx.fillRect(cx - 24, carY + 8, 6, 14); ctx.fillRect(cx + 18, carY + 8, 6, 14); ctx.fillRect(cx - 24, carY + 44, 6, 14); ctx.fillRect(cx + 18, carY + 44, 6, 14);
                    raf = requestAnimationFrame(loop);
                };
                raf = requestAnimationFrame(loop);
                const timer = setInterval(() => {
                    const s = S.current;
                    if (s.paused || s.over) return;
                    s.time -= 1;
                    setHud(h => ({ ...h, time: s.time }));
                    if (s.time <= 0) finish();
                }, 1000);
                const key = (e) => { if (e.key === 'ArrowLeft') move(-1); if (e.key === 'ArrowRight') move(1); };
                window.addEventListener('keydown', key);
                return () => { cancelAnimationFrame(raf); clearInterval(timer); window.removeEventListener('keydown', key); };
            }, []);

            const answer = (opt) => {
                if (fb || !q) return;
                setFb({ sel: opt });
                const ok = opt === q.a;
                setTimeout(() => {
                    const s = S.current;
                    if (ok) { s.net += cb.current.boost ? 20 : 10; cb.current.onPoints(10); }
                    else { s.net -= 6; s.lives -= 1; cb.current.penalty(6); }
                    setHud({ lives: s.lives, time: s.time, net: s.net, coins: s.coinsN });
                    s.obs = s.obs.filter(o => !o.hit);
                    setQ(null); setFb(null);
                    if (s.lives <= 0) { s.over = true; setOver(true); cb.current.onFinish(); }
                    else s.paused = false;
                }, 1100);
            };

            return (
                <div className="max-w-sm mx-auto select-none">
                    <div className="flex items-center justify-between gap-2 mb-3 text-sm font-black">
                        <button onClick={onHome || onExit} className="shrink-0 w-9 h-9 rounded-xl bg-slate-800 border border-white/10 text-white/70 hover:bg-red-600/60 hover:text-white flex items-center justify-center" title="Çık">✕</button>
                        <div className="bg-red-500/10 border border-red-500/30 px-3 py-1.5 rounded-xl">{'❤️'.repeat(Math.max(0, hud.lives))}{'🖤'.repeat(Math.max(0, 3 - hud.lives))}</div>
                        <div className={`px-3 py-1.5 rounded-xl border ${hud.time <= 10 ? 'text-red-400 border-red-500/50 animate-pulse' : 'text-white border-white/10 bg-white/5'}`}>⏱ {hud.time}s</div>
                        <div className="bg-amber-500/10 border border-amber-500/30 text-amber-300 px-3 py-1.5 rounded-xl">⭐ {hud.net >= 0 ? '+' : ''}{hud.net}</div>
                    </div>
                    <div className="relative rounded-3xl overflow-hidden border-4 border-slate-700 shadow-2xl bg-slate-800" style={{ width: '100%', aspectRatio: `${W} / ${H}` }}>
                        <canvas ref={canvasRef} width={W} height={H} className="w-full h-full block touch-none"
                            onPointerDown={(e) => { const r = e.currentTarget.getBoundingClientRect(); move(e.clientX - r.left < r.width / 2 ? -1 : 1); }} />
                        {q && (
                            <div className="absolute inset-0 bg-slate-950/92 backdrop-blur-sm p-4 flex flex-col justify-center">
                                <p className="text-[10px] font-black uppercase text-amber-400 tracking-widest mb-2 text-center">💥 Çarpışma! Soruyu doğru bil</p>
                                <h3 className="text-sm font-bold text-white text-center mb-4 leading-relaxed">{q.q}</h3>
                                <div className="space-y-2">
                                    {q.opts.map((o, i) => {
                                        let st = 'bg-white/5 border-white/10 text-white/90';
                                        if (fb) {
                                            if (o === q.a) st = 'bg-emerald-500/30 border-emerald-400 text-emerald-200';
                                            else if (o === fb.sel) st = 'bg-red-500/30 border-red-400 text-red-200';
                                            else st = 'opacity-40 border-white/5';
                                        }
                                        return <button key={i} onClick={() => answer(o)} className={`w-full p-3 rounded-xl border text-left text-xs font-semibold transition-all ${st}`}>{o}</button>;
                                    })}
                                </div>
                            </div>
                        )}
                        {over && (
                            <div className="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center p-6 text-center">
                                <div className="text-5xl mb-3">🏁</div>
                                <h3 className="text-2xl font-black italic uppercase mb-1">Yarış Bitti!</h3>
                                <p className="text-xs text-white/50 mb-4">{hud.coins} yıldız topladın</p>
                                <p className={`text-4xl font-black mb-6 ${hud.net >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>{hud.net >= 0 ? '+' : ''}{hud.net} Puan</p>
                                <div className="flex gap-3 w-full">
                                    <button onClick={onExit} className="flex-1 bg-white/10 py-3 rounded-xl text-xs font-bold uppercase">Menü</button>
                                    <button onClick={onRestart} className="flex-1 bg-emerald-600 py-3 rounded-xl text-xs font-bold uppercase">Tekrar</button>
                                </div>
                            </div>
                        )}

                setTimeout(() => resolve(atk, aOK, dOK), 900);
            };
            const forceResolve = (n) => {
                if (n !== roundN.current) return;
                const a = ansRef.current;
                if (a.h === null) a.h = false;
                if (a.g === null) a.g = false;
                hostTryResolve();
            };

            const startRound = () => {
                if (!online) { showRound(getQuestion()); return; }
                if (isGuest) return;
                roundN.current += 1;
                const n = roundN.current;
                ansRef.current = { h: null, g: null };
                const payload = { t: 'round', n, owner: st.current.owner, tl: st.current.timeLeft, qh: getQuestion(), qg: getQuestion() };
                lastRound.current = payload; send(payload);
                showRound(payload.qh);
                clearTimeout(forceT.current);
                forceT.current = setTimeout(() => forceResolve(n), 16000);
            };

            const finish = (scOv) => {
                if (doneRef.current) return; doneRef.current = true;
                clearTimeout(forceT.current);
                const sc = scOv || st.current.score;
                if (scOv) setScore(scOv);
                const bonus = sc.me > sc.opp ? 15 : sc.me === sc.opp ? 5 : 0;
                if (bonus) onPoints(bonus);
                setEarned(bonus + st.current.stats.ok + sc.me * 5);
                setPhase('over');
            };
            const endMatch = () => {
                if (isHost) send({ t: 'end', sc: flipSc(st.current.score) });
                finish();
            };

            // VS ekranı geri sayımı
            useEffect(() => {
                if (phase !== 'vs') return;
                if (isHost && online.invited && !oppSeen) return;
                if (cd <= 0) { setPhase('play'); startRound(); return; }
                const t = setTimeout(() => setCd(c => c - 1), 1000);
                return () => clearTimeout(t);
            }, [phase, cd, oppSeen]);

            // maç saati
            useEffect(() => {
                if (phase !== 'play') return;
                const t = setInterval(() => setTimeLeft(x => Math.max(0, x - 1)), 1000);
                return () => clearInterval(t);
            }, [phase]);

            useEffect(() => { if (phase === 'play' && timeLeft <= 0 && !busy && !isGuest) endMatch(); }, [timeLeft, phase, busy]);

            // soru süresi
            useEffect(() => {
                if (phase !== 'play' || !q || pick !== null || busy) return;
                if (qLeft <= 0) { answer(null); return; }
                const t = setTimeout(() => setQLeft(x => x - 1), 1000);
                return () => clearTimeout(t);
            }, [phase, q, pick, busy, qLeft]);

            // sonucu uygula (tüm taraflarda aynı, "ben = me" bakışıyla)
            const applyResult = (R) => {
                const nm = (team) => (team === 'me' ? teams.mine : teams.opp)[R.nc[team]].name;
                let m;
                if (R.kind === 'goal') {
                    m = { t: 'GOOOL! ⚽🔥', s: `${nm(R.atk)} çalımı attı ve ağlara gönderdi!`, k: R.atk === 'me' ? 'good' : 'bad' };
                    if (R.atk === 'me') onPoints(5);
                } else if (R.kind === 'dribble') {
                    m = { t: R.atk === 'me' ? 'ÇALIM! 🔥' : 'Rakip çalım attı! 😬', s: `${nm(R.atk)} rakibini geçti, top ilerliyor`, k: R.atk === 'me' ? 'good' : 'bad' };
                } else if (R.kind === 'steal') {
                    m = { t: R.def === 'me' ? 'TOPU KAPTIN! 🧤' : 'Rakip topu kaptı! 😮', s: `${nm(R.def)} topu aldı ve pas verdi`, k: R.def === 'me' ? 'good' : 'bad' };
                } else if (R.kind === 'both') {
                    m = { t: 'İKİSİ DE BİLDİ! 🌪️', s: 'Top havaya uçtu, rastgele bir yere düşüyor…', k: 'mid' };
                    setFlying(true); setTimeout(() => setFlying(false), 1100);
                } else {
                    m = { t: 'İKİSİ DE BİLEMEDİ 😅', s: 'Top yerinde kaldı', k: 'mid' };
                }
                setZone(R.z); setOwner(R.o); setScore(R.sc); setBx(R.bx); setCar(R.nc); setMsg(m);
            };

            // sonucu hesapla (offline + online host)
            const resolve = (atk, aOK, dOK) => {
                const { zone: z0, score: sc0 } = st.current;
                const dir = atk === 'me' ? 1 : -1;
                const def = atk === 'me' ? 'opp' : 'me';
                let z = z0, o = atk, sc = sc0, kind = 'none';
                if (aOK && !dOK) {
                    const nz = z0 + dir;
                    if (nz > 5 || nz < 1) { sc = { ...sc0, [atk]: sc0[atk] + 1 }; z = 3; o = def; kind = 'goal'; }
                    else { z = nz; kind = 'dribble'; }
                } else if (!aOK && dOK) {
                    o = def; z = Math.max(1, Math.min(5, z0 - dir)); kind = 'steal';
                } else if (aOK && dOK) {
                    z = ri(1, 5); o = Math.random() < 0.5 ? 'me' : 'opp'; kind = 'both';
                }
                const R = { kind, atk, def, z, o, sc, nc: { me: ri(0, 2), opp: ri(0, 2) }, bx: ri(25, 75) };
                applyResult(R);
                if (isHost) { lastRes.current = { t: 'res', n: roundN.current, R: flipR(R) }; send(lastRes.current); }
                setTimeout(() => {
                    if (sc.me >= 5 || sc.opp >= 5 || st.current.timeLeft <= 0) endMatch(); else startRound();
                }, 1700);
            };

            const answer = (opt) => {
                if (busy || pick !== null || !q) return;
                const meOK = opt !== null && opt === q.a;
                setPick(opt === null ? '__none' : opt);
                setBusy(true);
                setStats(x => ({ ok: x.ok + (meOK ? 1 : 0), total: x.total + 1 }));
                if (meOK) onPoints(1);
                if (online) {
                    const n = roundN.current;
                    send({ t: 'ans', n, ok: meOK });
                    if (oppAns.current.n === n) setBotOK(oppAns.current.ok);
                    if (isHost) { ansRef.current.h = meOK; hostTryResolve(); }
                    return;
                }
                const bOK = Math.random() < 0.55;
                setBotOK(bOK);
                const atk = owner;
                setTimeout(() => resolve(atk, atk === 'me' ? meOK : bOK, atk === 'me' ? bOK : meOK), 1300);
            };

            // ---- online mesajlar ----
            const onMsg = (pl) => {
                if (!pl) return;
                seenOpp.current = true; setOppSeen(true);
                if (pl.t === 'hello') {
                    if (isHost) {
                        if (lastRound.current && pl.n < roundN.current) send(lastRound.current);
                        if (lastRes.current && pl.r < lastRes.current.n) send(lastRes.current);
                    }
                    return;
                }
                if (pl.t === 'ans') {
                    if (pl.n !== roundN.current) return;
                    oppAns.current = { n: pl.n, ok: pl.ok };
                    if (st.current.pick !== null) setBotOK(pl.ok);
                    if (isHost) { ansRef.current.g = pl.ok; hostTryResolve(); }
                    return;
                }
                if (!isGuest) return;
                if (pl.t === 'round') {
                    if (pl.n <= roundN.current) return;
                    roundN.current = pl.n;
                    setOwner(pl.owner === 'me' ? 'opp' : 'me');
                    setTimeLeft(pl.tl);
                    showRound(pl.qg);
                } else if (pl.t === 'res') {
                    if (pl.n <= lastResN.current) return;
                    lastResN.current = pl.n;
                    setBusy(true);
                    applyResult(pl.R);
                } else if (pl.t === 'end') {
                    finish(pl.sc);
                }
            };
            const oppGone = () => {
                if (doneRef.current || st.current.phase === 'over') return;
                setOppLeft(true);
                const sc = st.current.score;
                finish({ me: Math.max(sc.me, sc.opp + 1), opp: sc.opp });
            };
            H.current = { onMsg, oppGone };

            useEffect(() => {
                if (!online || !sb) return;
                const ch = sb.channel('fbm-' + online.matchId, { config: { broadcast: { self: false }, presence: { key: user.id } } });
                chRef.current = ch;
                ch.on('broadcast', { event: 'fb' }, ({ payload }) => H.current.onMsg(payload))
                    .on('presence', { event: 'join' }, ({ key }) => { if (key === online.opp.id) { seenOpp.current = true; setOppSeen(true); } })
                    .on('presence', { event: 'leave' }, ({ key }) => { if (key === online.opp.id && seenOpp.current) H.current.oppGone(); })
                    .subscribe((status) => { if (status === 'SUBSCRIBED') ch.track({ id: user.id }); });
                return () => { clearTimeout(forceT.current); chRef.current = null; try { sb.removeChannel(ch); } catch (e) {} };
            }, []);
            useEffect(() => {
                if (!isGuest) return;
                const t = setInterval(() => { if (!doneRef.current) send({ t: 'hello', n: roundN.current, r: lastResN.current }); }, 2500);
                const t0 = setTimeout(() => send({ t: 'hello', n: 0, r: 0 }), 900);
                return () => { clearInterval(t); clearTimeout(t0); };
            }, []);
            useEffect(() => {
                if (!online) return;
                const t = setTimeout(() => { if (!seenOpp.current && !doneRef.current) { doneRef.current = true; setNoOpp(true); } }, online.invited ? 60000 : 20000);
                return () => clearTimeout(t);
            }, []);

            const mm = String(Math.floor(timeLeft / 60)).padStart(2, '0') + ':' + String(timeLeft % 60).padStart(2, '0');
            const myBadge = AVATARS.find(a => a.id === user.avatar) || AVATARS[0];
            const anyOpp = teams.opp[0];
            const oppBadge = AVATARS.find(a => a.id === anyOpp.avatar) || AVATARS[0];

            const PCard = ({ p, opp }) => {
                const b = AVATARS.find(a => a.id === p.avatar) || AVATARS[0];
                const bs = (p.badges || ['standard']).map(id => AVATARS.find(a => a.id === id)).filter(Boolean).slice(0, 5);
                return (
                    <div className={`flex-1 min-w-0 relative rounded-xl overflow-hidden border-2 ${opp ? 'border-amber-400 bg-gradient-to-b from-amber-500/60 to-orange-900/80' : 'border-fuchsia-400 bg-gradient-to-b from-indigo-500/70 to-purple-900/90'} ${p.me ? 'ring-2 ring-white' : ''}`}>
                        <div className={`absolute top-1 right-1 z-10 w-8 h-8 rounded-full flex items-center justify-center text-lg border border-white/70 ${b.color}`}>{b.emoji}</div>
                        <div className="absolute top-1 left-1 z-10 text-[10px] font-black bg-black/50 rounded px-1.5 py-0.5">⭐ {p.level}</div>
                        <Character3D char={p.char} scale={land ? 0.46 : 0.62} spin={false} interactive={false} height={land ? 105 : 150} />
                        <div className="bg-black/65 px-1.5 py-1">
                            <div className="text-[11px] font-black truncate">{p.name}{p.me ? ' (Sen)' : ''}</div>
                            <div className="flex items-center justify-between gap-1">
                                <span className="text-[9px] text-white/60 truncate">{p.role}</span>
                                <span className="text-[11px] leading-none whitespace-nowrap">{bs.map(x => x.emoji).join('')}</span>
                            </div>
                        </div>
                    </div>
                );
            };

            const css = <style>{`
                @keyframes fbhop2{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-150px) scale(1.7)}100%{transform:translateY(0) scale(1)}}
                @keyframes fbhop{0%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-220%) scale(2)}100%{transform:translate(-50%,-50%) scale(1)}}
                @keyframes fbpop{0%{opacity:0;transform:scale(.5)}25%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
            `}</style>;

            if (phase === 'vs') return (
                <div className="fixed inset-0 z-50 bg-gradient-to-b from-[#0b1020] to-[#1a0f2e] text-white flex flex-col items-center justify-center overflow-hidden">
                    {css}
                    <div className={land ? 'w-full max-w-3xl px-3 flex items-center gap-2' : 'w-full max-w-md px-3'}>
                        <div className="flex gap-2 flex-1 min-w-0">{teams.opp.map((p, i) => <PCard key={i} p={p} opp />)}</div>
                        <div className={`text-center font-black italic leading-none my-2 ${land ? "text-4xl" : "text-6xl"}`} style={{ textShadow: '0 4px 0 #6d28d9' }}>VS</div>
                        <div className="flex gap-2 flex-1 min-w-0">{teams.mine.map((p, i) => <PCard key={i} p={p} />)}</div>
                    </div>
                    <div className="absolute bottom-5 right-5 text-right font-black">
                        <div className="text-xs">Maçın başlamasına:</div>
                        <div className="text-7xl italic leading-none">{Math.max(cd, 0)}</div>
                    </div>
                    {isHost && online.invited && !oppSeen && <div className="absolute bottom-5 left-5 text-sm font-black text-cyan-300 animate-pulse">⏳ {online.opp.name} daveti bekleniyor…</div>}
                    <button onClick={onExit} className="absolute top-4 left-4 w-9 h-9 rounded-xl bg-white/10">✕</button>
                </div>
            );

            if (noOpp) return (
                <div className="fixed inset-0 z-50 bg-[#070b19] text-white flex items-center justify-center p-5">
                    <div className="w-full max-w-sm text-center">
                        <div className="text-6xl mb-2">📡</div>
                        <h2 className="text-2xl font-black uppercase">Rakip bağlanamadı</h2>
                        <p className="text-white/60 text-sm mt-2 mb-6">Rakip maça girmedi ya da bağlantısı koptu.</p>
                        <div className="flex gap-2">
                            <button onClick={onExit} className="flex-1 py-3 rounded-xl bg-white/10 font-bold text-xs uppercase">Menü</button>
                            <button onClick={onRestart} className="flex-1 py-3 rounded-xl bg-emerald-600 font-bold text-xs uppercase">Tekrar Ara</button>
                        </div>
                    </div>
                </div>
            );

            if (phase === 'over') {
                const w = score.me > score.opp, d = score.me === score.opp;
                return (
                    <div className="fixed inset-0 z-50 bg-[#070b19] text-white flex items-center justify-center p-5">
                        <div className="w-full max-w-sm text-center">
                            <div className="text-6xl mb-2">{w ? '🏆' : d ? '🤝' : '😔'}</div>
                            <h2 className="text-4xl font-black italic uppercase">{w ? 'KAZANDIN!' : d ? 'BERABERE' : 'KAYBETTİN'}</h2>
                            <div className="text-5xl font-black my-4">{score.me} - {score.opp}</div>
                            {oppLeft && <div className="text-sm text-amber-300 mb-3">Rakip maçtan ayrıldı, hükmen kazandın!</div>}
                            <div className="bg-white/5 rounded-2xl p-4 mb-5 text-sm space-y-1">
                                <div>✅ Doğru cevap: <b>{stats.ok}</b> / {stats.total}</div>
                                <div>⭐ Kazandığın puan: <b className="text-amber-300">+{earned}</b></div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={onExit} className="flex-1 py-3 rounded-xl bg-white/10 font-bold text-xs uppercase">Menü</button>
                                <button onClick={onRestart} className="flex-1 py-3 rounded-xl bg-emerald-600 font-bold text-xs uppercase">Tekrar Oyna</button>
                            </div>
                        </div>
                    </div>
                );
            }

            const ownerBadge = owner === 'me' ? myBadge : oppBadge;
            const ballTop = 100 - (zone / 6) * 100;
            return (
                <div className={`fixed inset-0 z-50 bg-[#070b19] text-white ${land ? "overflow-hidden" : "overflow-y-auto"}`}>
                    {css}
                    <div className={land ? "h-full grid gap-2 p-2" : "max-w-md mx-auto p-3 space-y-3"} style={land ? { gridTemplateColumns: "1.15fr 1fr", gridTemplateRows: "auto auto 1fr" } : undefined}>
                        <div className="flex items-center justify-between gap-2" style={land ? { gridColumn: 2, gridRow: 1 } : undefined}>
                            <button onClick={onExit} className="w-9 h-9 rounded-xl bg-white/10">✕</button>
                            <div className="flex items-center gap-3 bg-white/5 border border-white/10 rounded-2xl px-4 py-1.5">
                                <span className="text-xs font-bold text-fuchsia-300">SEN</span>
                                <span className="text-2xl font-black">{score.me} - {score.opp}</span>
                                <span className="text-xs font-bold text-amber-300">{online ? String(online.opp.name || 'RAKİP').slice(0, 8).toUpperCase() : 'RAKİP'}</span>
                            </div>
                            <div className={`font-black text-sm bg-white/5 border border-white/10 rounded-xl px-3 py-2 ${timeLeft <= 15 ? 'text-red-400 animate-pulse' : ''}`}>{mm}</div>
                        </div>

                        <div ref={sceneRef} className={`relative rounded-2xl overflow-hidden border border-white/15 flex items-center justify-center ${land ? "h-full" : "h-[270px]"}`} style={{ ...(land ? { gridColumn: 1, gridRow: "1 / span 3" } : {}), background: 'linear-gradient(#1e3a8a,#0b1020)' }}>
                            {(() => {
                                const PH = 560, TILT = 54;
                                const cl = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
                                const bxp = cl(bx / 100 * 300, 50, 250);
                                const byp = cl((1 - zone / 6) * PH, 60, PH - 60);
                                const place = (team) => {
                                    const d = team === 'me' ? -1 : 1;
                                    const roster = team === 'me' ? teams.mine : teams.opp;
                                    const c = car[team];
                                    const o = [0, 1, 2].filter(i => i !== c);
                                    const pos = [];
                                    if (owner === team) {
                                        pos[c] = [bxp - 22, byp];
                                        pos[o[0]] = [cl(bxp - 95, 35, 265), cl(byp - d * 60, 40, PH - 40)];
                                        pos[o[1]] = [cl(bxp + 95, 35, 265), cl(byp - d * 90, 40, PH - 40)];
                                    } else {
                                        pos[c] = [cl(bxp + 32, 35, 265), cl(byp - d * 48, 40, PH - 40)];
                                        pos[o[0]] = [cl(bxp - 85, 35, 265), cl(byp - d * 100, 40, PH - 40)];
                                        pos[o[1]] = [cl(bxp + 90, 35, 265), cl(byp - d * 135, 40, PH - 40)];
                                    }
                                    return roster.map((p, i) => ({ p, x: pos[i][0], y: pos[i][1], team, isC: i === c }));
                                };
                                const players = [...place('opp'), ...place('me')];
                                const crate = (x, y, k) => <FbStand key={k} x={x} y={y} w={40} h={38} feet={36}><div style={{ width: 40, height: 38, borderRadius: 7, background: 'linear-gradient(#fdba74 0 30%,#f97316 30%)', boxShadow: 'inset 0 -4px 0 #c2410c' }} /></FbStand>;
                                const Goal = ({ y }) => (
                                    <FbStand x={150} y={y} w={160} h={74} feet={74}>
                                        <div style={{ width: 160, height: 74, border: '6px solid #3b82f6', borderBottom: 'none', borderRadius: '6px 6px 0 0', background: 'repeating-linear-gradient(60deg,rgba(255,255,255,.35) 0 2px,transparent 2px 10px),repeating-linear-gradient(-60deg,rgba(255,255,255,.35) 0 2px,transparent 2px 10px),rgba(15,23,42,.45)' }} />
                                    </FbStand>
                                );
                                return (
                                    <div style={{ width: 460, height: 340, position: 'relative', flex: 'none', transform: `scale(${fit})`, perspective: 760, perspectiveOrigin: '50% 22%' }}>
                                        <div style={{ position: 'absolute', left: 20, bottom: -30, width: 420, height: PH, transformOrigin: '50% 100%', transform: `rotateX(${TILT}deg)`, transformStyle: 'preserve-3d', background: 'linear-gradient(90deg,#1e3a8a 0 6%,#f97316 6% 13%,transparent 13% 87%,#f97316 87% 94%,#1e3a8a 94%)' }}>
                                            <div style={{ position: 'absolute', left: 60, top: 0, width: 300, height: PH, transformStyle: 'preserve-3d', background: 'repeating-linear-gradient(0deg,#15803d 0 46px,#16a34a 46px 92px)' }}>
                                                {/* çizgiler */}
                                                <div style={{ position: 'absolute', left: 0, right: 0, top: PH / 2 - 1, height: 3, background: 'rgba(255,255,255,.55)' }} />
                                                <div style={{ position: 'absolute', left: 100, top: PH / 2 - 50, width: 100, height: 100, border: '3px solid rgba(255,255,255,.55)', borderRadius: '50%' }} />
                                                <div style={{ position: 'absolute', left: 70, top: 0, width: 160, height: 70, border: '3px solid rgba(255,255,255,.55)', borderTop: 'none' }} />
                                                <div style={{ position: 'absolute', left: 70, bottom: 0, width: 160, height: 70, border: '3px solid rgba(255,255,255,.55)', borderBottom: 'none' }} />
                                                {/* çalılar */}
                                                <div style={{ position: 'absolute', left: 10, top: 215, width: 58, height: 120, borderRadius: 16, background: 'repeating-radial-gradient(circle at 50% 50%,#4ade80 0 3px,#15803d 3px 9px)', opacity: .9 }} />
                                                <div style={{ position: 'absolute', left: 232, top: 110, width: 58, height: 96, borderRadius: 16, background: 'repeating-radial-gradient(circle at 50% 50%,#4ade80 0 3px,#15803d 3px 9px)', opacity: .9 }} />
                                                {/* oyuncu halkaları + top gölgesi */}
                                                {players.map((o) => <div key={'r' + o.team + o.p.name} style={{ position: 'absolute', left: o.x, top: o.y, width: 62, height: 62, marginLeft: -31, marginTop: -31, borderRadius: '50%', border: `3px solid ${o.isC ? '#facc15' : o.team === 'me' ? '#d946ef' : '#f59e0b'}`, background: o.team === 'me' ? 'rgba(217,70,239,.22)' : 'rgba(245,158,11,.22)', transition: 'left 1s ease, top 1s ease' }} />)}
                                                <div style={{ position: 'absolute', left: bxp, top: byp, width: 26, height: 12, marginLeft: -13, marginTop: -6, borderRadius: '50%', background: 'rgba(0,0,0,.4)', transition: 'left 1s ease, top 1s ease' }} />
                                                {/* dekor */}
                                                {[68, 110, 152].map(x => crate(x, 170, 'a' + x))}
                                                {[150, 192, 234].map(x => crate(x, 395, 'b' + x))}
                                                <FbStand x={60} y={470} w={30} h={36} feet={34}><div style={{ width: 30, height: 36, borderRadius: 9, background: 'linear-gradient(90deg,#1d4ed8,#60a5fa,#1d4ed8)' }} /></FbStand>
                                                <FbStand x={96} y={470} w={30} h={36} feet={34}><div style={{ width: 30, height: 36, borderRadius: 9, background: 'linear-gradient(90deg,#1d4ed8,#60a5fa,#1d4ed8)' }} /></FbStand>
                                                <Goal y={0} /><Goal y={PH} />
                                                {/* oyuncular */}
                                                {players.map((o) => (
                                                    <FbStand key={o.team + o.p.name} x={o.x} y={o.y} w={84} h={130} feet={118} move>
                                                        <Character3D char={o.p.char} scale={0.5} spin={false} interactive={false} height={130} startRot={o.team === 'me' ? 165 : -15} />
                                                        <div style={{ position: 'absolute', left: '50%', top: -4, transform: 'translateX(-50%)', whiteSpace: 'nowrap', fontSize: 10, fontWeight: 900, padding: '1px 6px', borderRadius: 8, background: o.team === 'me' ? 'rgba(162,28,175,.9)' : 'rgba(180,83,9,.9)', color: '#fff' }}>{(AVATARS.find(a => a.id === o.p.avatar) || AVATARS[0]).emoji} {o.p.name}</div>
                                                    </FbStand>
                                                ))}
                                                {/* top */}
                                                <FbStand x={bxp} y={byp} w={34} h={34} feet={30} move>

        function App() {

                } catch (e) {}
            };
            useEffect(() => {
                if (!user?.id) return;
                let st = { count: 0, last: '', best: 0 };
                try { st = JSON.parse(localStorage.getItem('sezan_streak_' + user.id)) || st; } catch (e) {}
                setStreak(st); pushStreakToApp(st);
                if (!sb || user.isSpecial) return;
                (async () => {
                    try {
                        const { data, error } = await sb.from('profiles').select('streak_count,streak_last,streak_best').eq('id', user.id).maybeSingle();
                        if (error || !data) return;
                        const sv = { count: data.streak_count || 0, last: data.streak_last || '', best: data.streak_best || 0 };
                        const serverNewer = sv.last > st.last || (sv.last === st.last && sv.count > st.count);
                        const win = serverNewer ? sv : st;
                        const merged = { count: win.count, last: win.last, best: Math.max(sv.best, st.best || 0, win.count) };
                        setStreak(merged); pushStreakToApp(merged);
                        try { localStorage.setItem('sezan_streak_' + user.id, JSON.stringify(merged)); } catch (e) {}
                        if (!serverNewer && (sv.last !== merged.last || sv.count !== merged.count)) sb.from('profiles').update({ streak_count: merged.count, streak_last: merged.last, streak_best: merged.best }).eq('id', user.id).then(() => {});
                    } catch (e) {}
                })();

            const [tick, setTick] = useState(0);

            const [input, setInput] = useState("");

                    if (registeringRef.current) return;

                sb.auth.getSession().then(({ data }) => loadProfile(data.session));
                const { data: sub } = sb.auth.onAuthStateChange((event, session) => {

                    setAccounts(mapped);

                    else if (me) setUser(u => (u && u.id === me.id && u.status !== me.status ? { ...u, status: me.status } : u));
                };
                const loadAnn = async () => {
                    const { data } = await sb.from('announcements').select('*');
                    if (!data) return;
                    const fresh = data.filter(a => !annIdsRef.current.has(a.id));
                    data.forEach(a => annIdsRef.current.add(a.id));

                const ch = sb.channel('sezan-live')

                    .on('postgres_changes', { event: '*', schema: 'public', table: 'announcements' }, () => loadAnn())
                    .subscribe();

            }, [firebaseUser && firebaseUser.id]);

                .filter(a => !a.isSpecial && a.role !== 'admin')

            // --- ARKADAŞLIK / MESAJ / YÖNETİCİ ARAÇLARI ---

            const [chatWith, setChatWith] = useState(null);

            const tmdMath = (text) => {
                let t = text.toLowerCase().replace(/,/g, '.').replace(/[’']\s*(nin|nın|nun|nün|in|ın|un|ün|si|sı|su|sü|i|ı)\b/g, ' ');
                const fmtN = (n) => String(Math.round(n * 1e6) / 1e6).replace('.', ',');
                const pm = t.match(/yüzde\s*(\d+\.?\d*)/) || t.match(/%\s*(\d+\.?\d*)/) || t.match(/(\d+\.?\d*)\s*%/);
                if (pm) {
                    const nums = (t.match(/\d+\.?\d*/g) || []);
                    const rest = nums.filter((n, i) => !(n === pm[1] && nums.indexOf(n) === i));
                    if (rest.length) { const p = parseFloat(pm[1]), n = parseFloat(rest[0]); return `🧮 ${fmtN(n)} sayısının %${fmtN(p)}'si:\n${fmtN(n)} × ${fmtN(p)} ÷ 100 = ${fmtN(n * p / 100)}`; }
                }
                t = t.replace(/kare\s*kök(ü)?|karekök(ü)?|√/g, ' sqrt ')
                     .replace(/çarpı|çarpı|kere|×/g, '*').replace(/(\d)\s*x\s*(?=\d)/g, '$1*')
                     .replace(/bölü|böl|÷|:/g, '/').replace(/artı|topla/g, '+').replace(/eksi|çıkar/g, '-')
                     .replace(/üssü|üstü/g, '^').replace(/kaçtır|kaç eder|kaç|eşittir|=|\?/g, ' ');
                t = t.replace(/sqrt\s*(\d+\.?\d*)/g, 'sqrt($1)');
                if (!/^(?:[\d+\-*/^().\s]|sqrt)+$/.test(t.trim()) || !/[+\-*/^]|sqrt/.test(t) || !/\d/.test(t)) return null;
                const sx = t.replace(/\s+/g, ''); let i = 0;
                const expr = () => { let v = term(); while (sx[i] === '+' || sx[i] === '-') { const o = sx[i++]; const r = term(); v = o === '+' ? v + r : v - r; } return v; };
                const term = () => { let v = pw(); while (sx[i] === '*' || sx[i] === '/') { const o = sx[i++]; const r = pw(); v = o === '*' ? v * r : v / r; } return v; };
                const pw = () => { const b = un(); if (sx[i] === '^') { i++; return Math.pow(b, pw()); } return b; };
                const un = () => { if (sx[i] === '-') { i++; return -un(); } if (sx[i] === '+') { i++; return un(); } return at(); };
                const at = () => {
                    if (sx.startsWith('sqrt', i)) { i += 4; return Math.sqrt(at()); }
                    if (sx[i] === '(') { i++; const v = expr(); if (sx[i] !== ')') throw 0; i++; return v; }
                    const m = /^\d+(\.\d+)?/.exec(sx.slice(i)); if (!m) throw 0; i += m[0].length; return parseFloat(m[0]);
                };
                try {
                    const v = expr(); if (i !== sx.length || !isFinite(v)) return null;
                    return `🧮 İşlem: ${sx.replace(/\*/g, ' × ').replace(/\//g, ' ÷ ').replace(/sqrt/g, '√')}\n✅ Sonuç: ${fmtN(v)}`;
                } catch (e) { return null; }
            };

            const TMD_STOP = new Set(['lütfen','bana','bize','biraz','uzun','ayrıntılı','detaylı','detaylıca','kısaca','anlat','anlatır','anlatsana','anlatın','anlatabilir','mısın','mısınız','misin','misiniz','musun','musunuz','açıkla','açıklar','nedir','ne','demek','kimdir','hakkında','bilgi','ver','verir','konusunu','konusu','konu','nasıl','neden','niçin','ilgili','ile','bir','söyle','öğret','öğretir','mi','mı','mu','mü','ve','bu','şu','olur','çok','de','da','hadi','şimdi','yani','bilmiyorum','bilmiyor','biliyor','sence','peki','acaba']);
            const tmdTopic = (msg) => msg.toLocaleLowerCase('tr').replace(/[’'][\p{L}]+/gu, '').replace(/[^\p{L}\p{N}\s]/gu, ' ').split(/\s+/).filter(w => w && !TMD_STOP.has(w)).join(' ').trim();

                    let t = page.extract.replace(/^=+\s*(.+?)\s*=+$/gm, '\n📌 $1').replace(/\n{3,}/g, '\n\n').trim();

                    if (cut > 200) t = t.slice(0, cut);
                    if (t.length > 3800) { t = t.slice(0, 3800); const p = Math.max(t.lastIndexOf('\n\n'), t.lastIndexOf('. ')); if (p > 1500) t = t.slice(0, p + 1); }

                } catch (e) {

            const tmdLocal = (msg) => {

                            <button onClick={() => tmdQuick('soru sor')} className="shrink-0 text-[10px] font-bold bg-blue-600/20 border border-blue-500/30 text-blue-300 px-3 py-1.5 rounded-full">📝 Soru sor</button>
                            <button onClick={() => tmdQuick('ipucu')} className="shrink-0 text-[10px] font-bold bg-amber-500/15 border border-amber-500/30 text-amber-300 px-3 py-1.5 rounded-full">💡 İpucu</button>
                            <button onClick={() => tmdQuick('puanım')} className="shrink-0 text-[10px] font-bold bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 px-3 py-1.5 rounded-full">⭐ Puanım</button>
                        </div>
                        <div className="p-3 bg-slate-950 flex gap-2">
                        <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' ? askAi() : null} placeholder="Soru sor..." className="flex-1 p-3 bg-white/5 border border-white/10 rounded-xl outline-none focus:border-blue-500 text-xs text-white" />
                        <button onClick={askAi} disabled={aiLoading || !input.trim()} className="p-3 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white rounded-xl"><Send size={14}/></button>
                        </div>
                    </div>
                    )}
                </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    
        </script>
    </body>
</html>
