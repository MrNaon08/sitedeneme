        const getCurriculumForGrade = (gradeStr) => {

            let courses = {};
            if (grade >= 5 && GRADE_CONTENT[grade]) {
                const styles = [
                    [<Calculator className="w-8 h-8" />, "bg-blue-600/20 text-blue-400 border-blue-500/30 hover:border-blue-500"],
                    [<BookOpen className="w-8 h-8" />, "bg-red-600/20 text-red-400 border-red-500/30 hover:border-red-500"],
                    [<Beaker className="w-8 h-8" />, "bg-emerald-600/20 text-emerald-400 border-emerald-500/30 hover:border-emerald-500"],
                    [<Users className="w-8 h-8" />, "bg-purple-600/20 text-purple-400 border-purple-500/30 hover:border-purple-500"],
                    [<Globe className="w-8 h-8" />, "bg-amber-600/20 text-amber-400 border-amber-500/30 hover:border-amber-500"],
                    [<Sparkles className="w-8 h-8" />, "bg-teal-600/20 text-teal-300 border-teal-500/30 hover:border-teal-500"]
                ];
                const order = { "Matematik": 0, "Türkçe": 1, "Fen Bilimleri": 2, "Sosyal Bilgiler": 3, "T.C. İnkılap Tarihi ve Atatürkçülük": 3, "İngilizce": 4, "Din Kültürü ve Ahlak Bilgisi": 5 };
                Object.keys(GRADE_CONTENT[grade]).forEach((name, i) => {
                    courses[name] = { icon: styles[order[name] ?? (i % 6)][0], topics: Object.keys(GRADE_CONTENT[grade][name]), color: styles[order[name] ?? (i % 6)][1] };
                });
                return courses;
            }
            
            courses["Matematik"] = { icon: <Calculator className="w-8 h-8" />, topics: BASE_TOPICS["Matematik"], color: "bg-blue-600/20 text-blue-400 border-blue-500/30 hover:border-blue-500" };
            courses["Türkçe"] = { icon: <BookOpen className="w-8 h-8" />, topics: BASE_TOPICS["Türkçe"], color: "bg-red-600/20 text-red-400 border-red-500/30 hover:border-red-500" };
            
            if (grade <= 3) {
                courses["Hayat Bilgisi"] = { icon: <Globe className="w-8 h-8" />, topics: BASE_TOPICS["Hayat Bilgisi"], color: "bg-amber-600/20 text-amber-400 border-amber-500/30 hover:border-amber-500" };

                courses["Sosyal Bilgiler"] = { icon: <Users className="w-8 h-8" />, topics: BASE_TOPICS["Sosyal Bilgiler"], color: "bg-purple-600/20 text-purple-400 border-purple-500/30 hover:border-purple-500" };

            useEffect(() => {

                    const fb = session ? session.user : null;

                    if (!fb) { userIdRef.current = null; setUser(null); setView('login'); return; }
                    if (registeringRef.current) return;
                    const { data, error } = await sb.from('profiles').select('*').eq('id', fb.id).maybeSingle();
                    if (data && data.status === 'banned') { await sb.auth.signOut(); alert('Hesabın yasaklandı. Yönetici ile iletişime geç.'); return; }
                    if (data) {
                        userIdRef.current = fb.id;
                        sb.from('profiles').update({ is_online: true }).eq('id', fb.id).then(() => {});
                        setUser({ ...mapProfile(data), isOnline: true });
                        setView(v => (v === 'login' ? 'dashboard' : v));
                    } else if (!error) { await sb.auth.signOut(); }
                };
                sb.auth.getSession().then(({ data }) => loadProfile(data.session));
                const { data: sub } = sb.auth.onAuthStateChange((event, session) => {
                    if (event === 'SIGNED_OUT') setTimeout(() => loadProfile(null), 0);
                    else if (event === 'SIGNED_IN' && session && userIdRef.current !== session.user.id) setTimeout(() => loadProfile(session), 0);
                    else if (event === 'PASSWORD_RECOVERY') {
                        setTimeout(() => {
                            const np = window.prompt('Yeni şifreni yaz (en az 6 karakter):');

                return () => sub.subscription.unsubscribe();

            useEffect(() => {

            useEffect(() => {

                const loadAcc = async () => {
                    const { data } = await sb.from('profiles').select('*');
                    if (!data) return;

                const loadAnn = async () => {
                    const { data } = await sb.from('announcements').select('*');
                    if (!data) return;
                    const fresh = data.filter(a => !annIdsRef.current.has(a.id));

                        setToast(n);

                    annLoadedRef.current = true;
                    setAnnouncements(data);
                };
                loadAcc(); loadAnn();
                const ch = sb.channel('sezan-live')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => loadAcc())
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'announcements' }, () => loadAnn())
                    .subscribe();
                const poll = setInterval(loadAcc, 30000);
                return () => { sb.removeChannel(ch); clearInterval(poll); };

            useEffect(() => {
                if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
            }, [chat, aiLoading]);

            useEffect(() => {

                    if (sb && user && !user.isSpecial) {
                        sb.from('profiles').update({ is_online: false }).eq('id', user.id).then(() => {});
                    }
                };
                window.addEventListener('beforeunload', handleUnload);
                return () => window.removeEventListener('beforeunload', handleUnload);
            }, [user]);

            const getLeaderboard = useMemo(() => {
                return [...accounts]
                .filter(a => !a.isSpecial && a.role !== 'admin')

            }, [accounts]);

            const sortedAnnouncements = useMemo(() => {
                return [...announcements].sort((a, b) => new Date(b.date) - new Date(a.date));
            }, [announcements]);

            const authError = (err) => {
                const m = ((err && err.code) || '') + ' ' + ((err && err.message) || '');
                const t = m.toLowerCase();
                if (t.includes('invalid') && t.includes('credential')) return 'E-posta veya şifre hatalı!';
                if (t.includes('already') || t.includes('registered')) return 'Bu e-posta ile zaten bir hesap var. Giriş yapmayı dene.';
                if (t.includes('weak') || t.includes('password should')) return 'Şifre en az 6 karakter olmalı.';
                if (t.includes('rate') || t.includes('too many')) return 'Çok fazla deneme yapıldı, biraz bekle.';
                if (t.includes('not confirmed') || t.includes('confirm')) return 'E-posta onayı açık görünüyor (Supabase ayarı).';
                if (t.includes('fetch') || t.includes('network')) return 'İnternet bağlantısı yok.';
                return 'Bir hata oluştu: ' + ((err && err.message) || 'bilinmeyen');
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                if (!auth) return alert('Bağlantı kurulamadı!');
                setAuthBusy(true);
                try {
                    const { error } = await sb.auth.signInWithPassword({ email: loginForm.email.trim(), password: loginForm.password });
                    if (error) throw error;
                } catch (err) { alert(authError(err)); }
                setAuthBusy(false);
            };

            const ADMIN_EMAILS = { weriqx: 'weriqx@example.com', selim: 'selim@example.com' };
            const handleAdminLogin = async (e) => {
                e.preventDefault();
                if (!sb) return alert('Bağlantı kurulamadı!');
                const em = ADMIN_EMAILS[adminForm.name.trim().toLowerCase()];
                if (!em) return alert('İsim veya şifre hatalı!');
                const pw = adminForm.password.length < 6 ? adminForm.password + '#sz' : adminForm.password;
                setAuthBusy(true);
                try {
                    const { error } = await sb.auth.signInWithPassword({ email: em, password: pw });
                    if (error) throw error;
                } catch (err) { alert('İsim veya şifre hatalı!'); }
                setAuthBusy(false);
            };

            const handleForgot = async () => {
                if (!auth || !loginForm.email.trim()) return alert('Önce e-posta adresini yaz.');
                try { const { error } = await sb.auth.resetPasswordForEmail(loginForm.email.trim(), { redirectTo: window.location.origin }); if (error) throw error; alert('Şifre sıfırlama bağlantısı e-postana gönderildi.'); }
                catch (err) { alert(authError(err)); }
            };

            const sendVerificationCode = async (e) => {
                if (e) e.preventDefault();
                if (!auth) return alert('Bağlantı kurulamadı!');
                const f = { ...regForm, first: regForm.first.trim(), last: regForm.last.trim(), email: regForm.email.trim().toLowerCase() };
                if (!f.first || !f.last) return alert('İsim ve soyisim zorunlu.');
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email)) return alert('Geçerli bir e-posta yaz.');
                if (f.pass.length < 6) return alert('Şifre en az 6 karakter olmalı.');
                if (f.pass !== f.pass2) return alert('Şifreler aynı değil!');
                const code = String(crypto.getRandomValues(new Uint32Array(1))[0] % 1000000).padStart(6, '0');
                setAuthBusy(true);
                try {
                    await window.emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID,
                        { to_email: f.email, email: f.email, to_name: f.first, name: f.first, code: code },
                        { publicKey: EMAILJS_PUBLIC_KEY });
                    pendingRef.current = { code, exp: Date.now() + 10 * 60 * 1000, tries: 0, form: f };
                    setCodeInput(''); setRegStep('code'); setCooldown(60);
                } catch (err) { console.error(err); alert('Kod gönderilemedi. E-postayı kontrol edip tekrar dene.'); }
                setAuthBusy(false);
            };

            const verifyCodeAndRegister = async (e) => {
                e.preventDefault();
                const p = pendingRef.current;
                if (!p) { setRegStep('form'); return; }
                if (Date.now() > p.exp) { pendingRef.current = null; setRegStep('form'); return alert('Kodun süresi doldu. Yeniden kayıt ol.'); }
                if (p.tries >= 5) { pendingRef.current = null; setRegStep('form'); return alert('Çok fazla yanlış deneme. Yeniden kayıt ol.'); }
                if (codeInput.trim() !== p.code) { p.tries += 1; return alert('Kod yanlış! Kalan hak: ' + (5 - p.tries)); }
                const f = p.form;
                setAuthBusy(true);
                registeringRef.current = true;
                try {
                    const { data: su, error: suErr } = await sb.auth.signUp({ email: f.email, password: f.pass, options: { data: { first_name: f.first, last_name: f.last, grade: f.grade } } });
                    if (suErr) throw suErr;
                    if (!su.session) {
                        const r = await sb.auth.signInWithPassword({ email: f.email, password: f.pass });
                        if (r.error) throw r.error;
                    }
                    const uid = su.user.id;

                    if (profErr) throw profErr;
                    const accountData = { ...mapProfile(prof), isOnline: true };

                    setView('dashboard');
                    setRegForm({ first: '', last: '', email: '', pass: '', pass2: '', grade: '5' });

                    alert(authError(err));
                    if (((err && err.message) || '').toLowerCase().includes('registered')) { pendingRef.current = null; setRegStep('form'); }

                registeringRef.current = false;

            const startQuiz = (topicName, count) => {
                const gNum = parseInt(user?.grade);
                const bank = (gNum >= 5 && GRADE_CONTENT[gNum]) ? GRADE_CONTENT[gNum] : QUESTION_BANK;
                const courseData = bank[selectedCourse] || {};
                let pool = courseData[topicName] || [];
                if (typeof pool === 'function') { const gen = pool; pool = Array.from({ length: 10 }, () => gen()); }
                
                if (pool.length === 0) {
                    pool = [{ q: "Sistemde bu konuya ait soru bulunamadı.", a: "Tamam", w: ["Hata", "Bekle", "Çıkış"], ex: "Sistem güncelleniyor." }];
                }

                const shuffledPool = shuffleArray(pool);
                const actualCount = Math.min(count, pool.length);
                const processedQuestions = shuffledPool.slice(0, actualCount).map(q => ({
                   ...q, opts: shuffleArray([q.a, ...q.w])
                }));
                
                setQuiz({ current: 0, correct: 0, topic: topicName, questions: processedQuestions });
                setAnsState({ sel: null, show: false, correct: null });

                if (ansState.show) return;
                const currentQuestion = quiz.questions[quiz.current];
                const isCorrect = opt === currentQuestion.a;
                setAnsState({ sel: opt, show: true, correct: currentQuestion.a });
                
                if (isCorrect) updateUserPoints(10);
                else updateUserPoints(-6);

                setTimeout(() => {
                const nextCorrect = isCorrect ? quiz.correct + 1 : quiz.correct;
                if (quiz.current + 1 < quiz.questions.length) {
                    setQuiz({ ...quiz, current: quiz.current + 1, correct: nextCorrect });
                    setAnsState({ sel: null, show: false, correct: null });
                } else {
                    setAnalysis({ score: ((nextCorrect / quiz.questions.length) * 100).toFixed(0), correct: nextCorrect, total: quiz.questions.length });

                    setAnsState({ sel: null, show: false, correct: null });

                }, 2800);

                const grade = parseInt(user?.grade || "1");
                const isAdvanced = grade >= 4;
                const ops = isAdvanced ? ['+', '-', 'x'] : ['+', '-'];
                const op = ops[Math.floor(Math.random() * ops.length)];
                let a = Math.floor(Math.random() * (grade * 10)) + 1;
                let b = Math.floor(Math.random() * (grade * 10)) + 1;
                let answer = 0;
                if (op === '+') answer = a + b;
                else if (op === '-') { if (b > a) [a, b] = [b, a]; answer = a - b; }
                else if (op === 'x') { a = Math.floor(Math.random() * 10) + 1; b = Math.floor(Math.random() * 10) + 1; answer = a * b; }

                let w2 = answer - Math.floor(Math.random() * 5) - 1;
                let w3 = answer + 10;
                const opts = shuffleArray([answer, w1, w2, w3]);
                setCurrentMathQ({ q: `${a} ${op} ${b} = ?`, a: answer, opts });

                            </div>
                            <div className="bg-slate-900/80 border border-white/10 p-6 rounded-3xl flex flex-col h-full min-h-[250px]">
                                <h3 className="font-bold text-sm text-white mb-4 flex items-center justify-between"><span className="flex items-center gap-2">Sistemdeki Duyurular ({announcements.length})</span></h3>
                                <div className="flex-1 overflow-y-auto space-y-3 pr-2 custom-scrollbar max-h-[250px]">
                                    {sortedAnnouncements.length === 0 ? <p className="text-white/40 text-xs text-center py-10">Hiç duyuru yok.</p> : null}
                                    {sortedAnnouncements.map(ann => (
                                    <div key={ann.id} className="bg-slate-950 p-4 rounded-xl border border-white/5 flex items-start justify-between group">
                                        <div>
                                            <h4 className="font-bold text-white text-xs">{ann.title}</h4>
                                            <p className="text-[10px] text-white/50 mt-1 line-clamp-2">{ann.message}</p>
                                        </div>
                                        <button onClick={() => handleDeleteAnnouncement(ann.id)} className="text-white/20 hover:text-red-500 p-2 rounded-lg hover:bg-white/5 transition-all"><Trash2 size={16} /></button>
                                    </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        </div>
                    ) : view === 'purchase' ? (
                        <div className="max-w-md mx-auto mt-16 text-center bg-slate-900/60 border border-pink-500/30 p-10 rounded-[2.5rem]">
                            <div className="text-6xl mb-4">🛠️</div>
                            <h2 className="text-2xl font-black uppercase italic text-pink-400 mb-3">Bakımda</h2>
                            <p className="text-sm text-white/60 mb-6">Satın alma sayfası şu an bakımda. Çok yakında burada olacak!</p>
                            <button onClick={() => setView('dashboard')} className="px-6 py-3 rounded-2xl bg-slate-800 border border-white/10 font-bold text-xs uppercase">Geri Dön</button>
                        </div>
                    ) : view === 'leaderboard' ? (
                        <div className="max-w-2xl mx-auto py-6 animate-in fade-in slide-in-from-bottom-4">
                        <div className="text-center mb-10">
                            <Trophy size={56} className="text-amber-400 mx-auto mb-4 drop-shadow-[0_0_15px_rgba(251,191,36,0.5)]" />
                            <h2 className="text-3xl font-black italic uppercase tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-amber-200">Liderlik Tablosu</h2>
                            <p className="text-xs text-white/50 font-bold uppercase tracking-widest mt-2">En Çok Yıldız Kazanan Öğrenciler</p>
                        </div>
                        <div className="space-y-3">
                            {getLeaderboard.map((l, idx) => (
                                <div key={l.id} className={`p-5 rounded-[1.5rem] flex items-center justify-between border transition-all ${l.isPro ? 'bg-blue-500/10 border-blue-500/30 shadow-[0_0_15px_rgba(59,130,246,0.1)]' : 'bg-slate-900 border-white/10'}`}>
                                <div className="flex items-center gap-4">
                                    <div className={`w-10 h-10 rounded-2xl flex items-center justify-center font-black text-sm shadow-inner ${idx === 0 && l.points > 0 ? 'bg-amber-400 text-slate-900 shadow-amber-200' : 'bg-slate-800 text-white'}`}>{idx + 1}</div>
                                    <div>
                                    <h4 className="font-bold text-white flex items-center gap-2">{l.name} {l.isPro && <Zap size={14} className="text-blue-400"/>}</h4>
                                    <p className="text-[10px] text-white/40 uppercase font-bold">{l.isPro ? 'PRO ÖĞRENCİ' : `${l.grade}. Sınıf Öğrencisi`}</p>
                                    </div>
                                </div>
                                <div className={`font-black flex items-center gap-1.5 text-lg ${l.isPro ? 'text-blue-400' : 'text-white'}`}>
                                    {l.points} <Star size={16} className={l.isPro ? "fill-blue-400" : "fill-amber-500"}/>
                                </div>
                                </div>
                            ))}
                            {getLeaderboard.length === 0 && <p className="text-center text-white/40 text-sm mt-10">Henüz kimse giriş yapmadı veya puan kazanamadı.</p>}
                        </div>
                        </div>
                    ) : view === 'info' ? (
                        <div className="max-w-md mx-auto text-center py-6 animate-in fade-in zoom-in-95">
                        <h2 className="text-3xl font-black italic mb-8 uppercase text-blue-400 tracking-tighter">Ekibimiz</h2>
                        <div className="bg-slate-900/80 border border-white/10 p-8 rounded-[2.5rem] space-y-8 shadow-2xl relative overflow-hidden">
                            <div className="absolute -top-10 -right-10 w-32 h-32 bg-blue-600/10 rounded-full blur-2xl"></div>
                            <div className="relative z-10"><h3 className="text-[10px] text-blue-400 font-black uppercase tracking-[0.2em] mb-2">Yönetim</h3><p className="font-bold text-white text-lg">Yusuf T.<br/>Selim K.</p></div>
                            <div className="relative z-10"><h3 className="text-[10px] text-emerald-400 font-black uppercase tracking-[0.2em] mb-2">Destek Ekip</h3><p className="font-bold text-white text-lg">Funda K.<br/>Görkem</p></div>
                            <div className="relative z-10"><h3 className="text-[10px] text-purple-400 font-black uppercase tracking-[0.2em] mb-2">Tasarım</h3><p className="font-bold text-white text-lg">Yusuf T.<br/>Selim K.<br/>Görkem</p></div>
                            <div className="pt-6 border-t border-white/10 mt-6 relative z-10"><p className="text-sm font-black italic text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-blue-400 tracking-wider">Sezan Studios Sunar..</p></div>
                        </div>
                        </div>
                    ) : view === 'games' ? (
                        <div className="animate-in fade-in slide-in-from-bottom-4 duration-300">
                        {gameState === 'menu' && (
                            <div className="text-center py-10 max-w-lg mx-auto">
                            <div className="w-24 h-24 bg-emerald-500/20 rounded-3xl mx-auto flex items-center justify-center mb-6 border-2 border-emerald-500/30"><Gamepad2 size={48} className="text-emerald-400" /></div>
                            <h2 className="text-4xl font-black italic uppercase tracking-tighter text-emerald-400 mb-2">OYUN SALONU</h2>
                            <p className="text-white/60 text-sm mb-10">Sınıf seviyene uygun eğitim oyunları oynayarak eğlen ve yıldız kazan!</p>
                            <div className="bg-slate-900 border border-white/10 p-6 rounded-3xl text-left hover:border-emerald-500/30 transition-all cursor-pointer group" onClick={startGame}>
                                <h3 className="font-bold text-lg text-white mb-2 group-hover:text-emerald-400">🚀 Hızlı Matematik</h3>
                                <p className="text-xs text-white/50 mb-4">Ekrana gelen rastgele işlemleri 60 saniye içinde çözebildiğin kadar hızlı çöz! <br/> <strong className="text-red-400">DİKKAT: Yanlış cevaplarda -6 Puan silinir.</strong></p>
                                <button className="w-full bg-emerald-600 py-3 rounded-xl font-bold uppercase text-xs">Oyuna Başla</button>
                            </div>
                            </div>
                        )}
                        {gameState === 'playing' && currentMathQ && (
                            <div className="max-w-md mx-auto bg-slate-900 border border-white/10 rounded-[3rem] p-8 text-center relative overflow-hidden shadow-2xl">
                            <div className="absolute top-0 left-0 w-full h-1.5 bg-white/5"><div className="h-full bg-emerald-500 transition-all duration-1000" style={{width: `${(timeLeft/60)*100}%`}}></div></div>
                            <div className="flex justify-between items-center mb-10 mt-2">
                                <div className="flex items-center gap-2 text-amber-400 font-bold bg-amber-500/10 px-3 py-1.5 rounded-xl border border-amber-500/20"><Award size={16}/> Skor: {gameScore}</div>
                                <div className={`flex items-center gap-2 font-bold bg-white/5 px-3 py-1.5 rounded-xl border border-white/10 ${timeLeft <= 10 ? 'text-red-500 animate-pulse border-red-500/50' : 'text-white'}`}><Timer size={16}/> {timeLeft}s</div>
                            </div>
                            <h3 className="text-5xl font-black mb-12 text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-blue-400">{currentMathQ.q}</h3>
                            <div className="grid grid-cols-2 gap-3">
                                {currentMathQ.opts.map((opt, i) => (
                                <button key={i} onClick={() => handleGameAnswer(opt)} className="bg-slate-800 hover:bg-emerald-600 py-6 rounded-2xl text-2xl font-black transition-all active:scale-95 border border-white/5 hover:border-emerald-400">{opt}</button>
                                ))}
                            </div>
                            </div>
                        )}
                        {gameState === 'over' && (
                            <div className="max-w-md mx-auto text-center py-10 animate-in zoom-in-95">
                            <Trophy size={64} className="text-emerald-500 mx-auto mb-6" />
                            <h2 className="text-4xl font-black italic uppercase tracking-tighter text-white mb-2">SÜRE BİTTİ!</h2>
                            <div className="bg-slate-900 border border-white/10 rounded-3xl p-6 mb-8 mt-4 flex justify-around">
                                <div><p className="text-[10px] text-white/40 uppercase font-bold mb-1">Hesabına Yansıyan (Net)</p><p className={`text-3xl font-black ${gameScore >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>{gameScore >= 0 ? `+${gameScore}` : gameScore}</p></div>
                            </div>
                            <div className="flex gap-3">
                                <button onClick={() => setGameState('menu')} className="flex-1 bg-white/5 hover:bg-white/10 py-4 rounded-2xl font-bold uppercase text-xs">Menüye Dön</button>
                                <button onClick={startGame} className="flex-1 bg-emerald-600 hover:bg-emerald-500 py-4 rounded-2xl font-bold uppercase text-xs">Tekrar Oyna</button>
                            </div>
                            </div>
                        )}
                        </div>
                    ) : showStore ? (
                        <div className="animate-in fade-in duration-300">
                        <div className="flex items-center justify-between mb-8">
                            <div><h2 className="text-2xl sm:text-3xl font-black italic text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300 uppercase tracking-tighter">KARAKTER DOLABI</h2></div>
                            <button onClick={() => setShowStore(false)} className="p-2.5 bg-slate-800 border border-white/10 rounded-full hover:bg-slate-700 transition-colors"><X size={18}/></button>
                        </div>
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            {AVATARS.map(av => {
                            const isUnlocked = user?.unlocked?.includes(av.id);
                            const isEquipped = user?.avatar === av.id;
                            const canAfford = user?.points >= av.price;
                            return (
                                <div key={av.id} className={`p-5 rounded-3xl bg-slate-900/60 border transition-all text-center flex flex-col justify-between ${isEquipped ? 'border-blue-500 bg-blue-500/5' : 'border-white/5'}`}>
                                    <div><div className={`w-16 h-16 mx-auto mb-3 rounded-2xl flex items-center justify-center text-3xl shadow-lg ${av.color}`}>{av.emoji}</div><h4 className="font-black text-sm mb-1">{av.label}</h4><p className="text-[10px] text-white/40 uppercase mb-4">{av.price === 0 ? 'Bedava' : `${av.price} Yıldız`}</p></div>
                                    {isUnlocked ? <button onClick={() => { setUser({...user, avatar: av.id}); if (sb && user.id && !user.isSpecial) sb.from('profiles').update({ avatar: av.id }).eq('id', user.id).then(() => {}); }} className={`w-full py-2.5 rounded-xl text-xs font-black uppercase ${isEquipped ? 'bg-blue-600 text-white' : 'bg-slate-800 text-white/70'}`}>{isEquipped ? 'Kuşanıldı' : 'Kuşan'}</button> : <button onClick={() => handleBuyAvatar(av)} disabled={!canAfford} className={`w-full py-2.5 rounded-xl text-xs font-black uppercase flex items-center justify-center gap-1 ${canAfford ? 'bg-amber-500 text-slate-950' : 'bg-slate-800/50 text-white/20'}`}><Star size={12} className={canAfford ? "fill-slate-950" : "fill-white/10"} /> {av.price} Aç</button>}
                                </div>
                            );
                            })}
                        </div>
                        </div>
                    ) : analysis ? (
                        <div className="max-w-md mx-auto py-8 text-center animate-in zoom-in-95 duration-200">
                        <Trophy size={48} className="text-amber-400 mx-auto mb-6" />
                        <h2 className="text-3xl font-black italic mb-2 uppercase text-amber-400">Tebrikler!</h2>
                        <div className="grid grid-cols-2 gap-4 mb-8">
                            <div className="bg-slate-900/80 p-5 rounded-2xl border border-white/5"><p className="text-[10px] text-white/40 font-bold mb-1 uppercase">DOĞRU CEVAP</p><p className="text-2xl font-black text-amber-400 flex items-center justify-center gap-1">{analysis.correct} / {analysis.total}</p></div>
                            <div className="bg-slate-900/80 p-5 rounded-2xl border border-white/5"><p className="text-[10px] text-white/40 font-bold mb-1 uppercase">BAŞARI</p><p className="text-2xl font-black text-blue-400">%{analysis.score}</p></div>
                        </div>
                        <button onClick={() => {setAnalysis(null); setSelectedCourse(null); setSelectedTopic(null);}} className="w-full bg-blue-600 py-4 rounded-2xl font-black uppercase shadow-xl transition-all">Derslere Dön</button>
                        </div>
                    ) : quiz ? (
                        <div className="max-w-2xl mx-auto py-2">
                        <div className="bg-slate-900/80 backdrop-blur-md p-6 sm:p-10 rounded-[2.5rem] border border-white/10 relative overflow-hidden shadow-2xl">
                            <div className="absolute top-0 left-0 h-1.5 bg-gradient-to-r from-blue-500 to-indigo-500 transition-all duration-500" style={{width: `${((quiz.current + 1) / quiz.questions.length) * 100}%`}}></div>
                            <div className="flex justify-between items-center mb-8 pt-2"><span className="bg-blue-500/20 text-blue-300 text-[10px] font-black px-3 py-1 rounded-full uppercase">Soru {quiz.current + 1} / {quiz.questions.length}</span><span className="text-xs text-white/40 font-bold uppercase">{selectedTopic}</span></div>
                            <h3 className="text-lg sm:text-xl font-bold leading-relaxed text-white mb-8">{quiz.questions[quiz.current].q}</h3>
                            <div className="space-y-3 mb-6">
                                {quiz.questions[quiz.current].opts.map((opt, idx) => {
                                let btnStyle = "bg-white/5 border-white/10 text-white/80"; let icon = <HelpCircle className="w-5 h-5 opacity-40" />;
                                if (ansState.show) {
                                    if (opt === ansState.correct) { btnStyle = "bg-emerald-500/20 border-emerald-500 text-emerald-300"; icon = <CheckCircle2 className="w-5 h-5 text-emerald-400" />; } 
                                    else if (opt === ansState.sel) { btnStyle = "bg-red-500/20 border-red-500 text-red-300"; icon = <XCircle className="w-5 h-5 text-red-400" />; } else { btnStyle = "opacity-40"; icon = null; }
                                }
                                return (<button key={idx} onClick={() => handleAnswer(opt)} disabled={ansState.show} className={`w-full p-4 rounded-xl border text-left flex items-center justify-between transition-all duration-200 text-sm font-semibold ${btnStyle}`}><span>{opt}</span>{icon}</button>);
                                })}
                            </div>
                            {ansState.show && (<div className="p-4 bg-blue-950/40 border border-blue-500/20 rounded-2xl animate-in fade-in slide-in-from-bottom-2"><div className="flex gap-2 items-center text-blue-400 font-bold text-xs uppercase mb-1"><Sparkles size={14} /> İpucu</div><p className="text-xs text-white/70">{quiz.questions[quiz.current].ex}</p></div>)}
                        </div>
                        </div>
                    ) : selectedCourse ? (
                        <div className="animate-in fade-in duration-300">
                        <button onClick={() => { setSelectedCourse(null); setSelectedTopic(null); }} className="flex items-center gap-2 text-xs font-bold text-white/40 hover:text-white mb-6 uppercase"><ArrowLeft size={16}/> Derslere Dön</button>
                        <div className="flex items-center gap-4 mb-8"><div className={`p-4 rounded-2xl bg-slate-900 border border-white/10 ${curriculum[selectedCourse]?.color.split(' ')[0]}`}>{curriculum[selectedCourse]?.icon}</div><div><h2 className="text-3xl font-black italic uppercase text-white">{selectedCourse}</h2><p className="text-xs text-white/40 uppercase font-bold">Çalışmak istediğin konuyu seç</p></div></div>
                        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            {curriculum[selectedCourse]?.topics.map((topic, index) => (
                            <div key={index} className="bg-slate-900/60 border border-white/5 p-6 rounded-3xl flex flex-col justify-between h-full min-h-[160px] group hover:border-blue-500/30 transition-all">
                                <div><h3 className="font-bold text-lg text-white mb-1">{topic}</h3><p className="text-[10px] text-white/30 uppercase font-bold mb-4 flex items-center gap-1"><LayoutList size={10}/> 5 Soru</p></div>
                                <div className="flex gap-2 mt-2">
                                <button onClick={() => { setSelectedTopic(topic); startQuiz(topic, 3); }} className="flex-1 bg-white/5 hover:bg-white/10 py-3 rounded-xl font-bold text-[10px] uppercase">3 Soru Çöz</button>
                                <button onClick={() => { setSelectedTopic(topic); startQuiz(topic, 5); }} className="flex-1 bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold text-[10px] uppercase flex items-center justify-center gap-1.5"><Play size={10} className="fill-white" /> Hepsini Çöz</button>
                                </div>
                            </div>
                            ))}
                        </div>
                        </div>
                    ) : (
                        <div className="animate-in fade-in duration-300">
                        <div className="mb-8"><h2 className="text-2xl sm:text-3xl font-black italic uppercase tracking-tighter">Hoş Geldin, {user?.name.split(' ')[0]}!</h2><p className="text-xs text-white/40 font-bold uppercase tracking-wider">{user?.grade}. Sınıf Dersleri</p></div>
                        
                        {/* DUYURU PANOSU (HERKES GÖRÜR) */}
                        {sortedAnnouncements.length > 0 && (
                            <div className="mb-8 bg-blue-900/20 border border-blue-500/30 p-6 rounded-[2rem] relative overflow-hidden">
                                <div className="flex items-center gap-2 text-blue-400 mb-4 font-black uppercase text-sm">
                                   <Megaphone size={18} /> GÜNCEL DUYURULAR
                                </div>
                                <div className="space-y-3">
                                   {sortedAnnouncements.map(ann => (
                                       <div key={ann.id} className="bg-slate-900/80 p-4 rounded-xl border border-blue-500/10">
                                           <h4 className="font-bold text-white text-sm">{ann.title}</h4>
                                           <p className="text-xs text-white/70 mt-1.5 leading-relaxed">{ann.message}</p>
                                           <p className="text-[9px] text-white/30 mt-3 text-right uppercase tracking-wider font-bold">{new Date(ann.date).toLocaleDateString('tr-TR')} - {ann.author}</p>
                                       </div>
                                   ))}
                                </div>
                            </div>
                        )}

                        <div className="grid sm:grid-cols-2 gap-4">
                            {Object.entries(curriculum).map(([courseName, item]) => (
                            <div key={courseName} onClick={() => setSelectedCourse(courseName)} className={`p-6 rounded-[2rem] border bg-slate-900/40 cursor-pointer flex items-center justify-between group ${item.color}`}>
                                <div className="flex items-center gap-4"><div className="p-4 rounded-2xl bg-slate-950/60 border border-white/5">{item.icon}</div><div><h3 className="font-black italic text-lg uppercase tracking-tight">{courseName}</h3><p className="text-xs opacity-60 font-semibold">{item.topics.length} Konu Aktif</p></div></div><ChevronRight className="w-5 h-5 opacity-40 group-hover:translate-x-1 transition-transform" />
                            </div>
                            ))}
                        </div>
                        </div>
                    )}
                    </main>
                </div>

                {/* ASİSTAN */}
                <div className="fixed bottom-4 right-4 z-50">
                    {!aiOpen ? (
                    <button onClick={() => setAiOpen(true)} className="flex items-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-sm px-5 py-4 rounded-2xl shadow-2xl hover:scale-105 transition-all"><Bot size={20} className="animate-pulse" /><span className="hidden sm:inline">Sezan TMD</span></button>
                    ) : (
                    <div className="w-[320px] sm:w-[360px] h-[450px] bg-slate-900 border border-white/10 rounded-[2rem] shadow-2xl overflow-hidden flex flex-col justify-between animate-in slide-in-from-bottom-5">
                        <div className="p-4 bg-slate-950 border-b border-white/5 flex items-center justify-between">
                        <div className="flex items-center gap-2"><div className="w-8 h-8 bg-blue-600/20 text-blue-400 rounded-lg flex items-center justify-center"><Bot size={18} /></div><div><h4 className="font-black text-xs text-blue-400 uppercase tracking-wider">Sezan TMD Asistanı</h4><p className="text-[9px] text-emerald-400 font-bold flex items-center gap-1"><span className="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-ping"></span> Çevrimiçi</p></div></div>
                        <button onClick={() => setAiOpen(false)} className="p-1 text-white/50 hover:text-white transition-all"><X size={16}/></button>
                        </div>
                        <div ref={scrollRef} className="flex-1 p-4 overflow-y-auto space-y-3 text-xs custom-scrollbar">
                        {chat.map((msg, i) => (<div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}><div className={`max-w-[85%] p-3 rounded-xl leading-relaxed ${msg.role === 'user' ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white/5 text-white/80 rounded-bl-none border border-white/5'}`}>{msg.text}</div></div>))}
                        {aiLoading && <div className="flex justify-start"><div className="bg-white/5 p-3 rounded-xl rounded-bl-none border flex items-center gap-2"><span className="w-1.5 h-1.5 bg-white/40 rounded-full animate-bounce"></span><span className="w-1.5 h-1.5 bg-white/40 rounded-full animate-bounce delay-150"></span><span className="w-1.5 h-1.5 bg-white/40 rounded-full animate-bounce delay-300"></span></div></div>}
                        </div>
                        <div className="p-3 bg-slate-950 border-t border-white/5 flex gap-2">
                        <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' ? askAi() : null} placeholder="Soru sor..." className="flex-1 p-3 bg-white/5 border border-white/10 rounded-xl outline-none focus:border-blue-500 text-xs text-white" />
                        <button onClick={askAi} disabled={aiLoading || !input.trim()} className="p-3 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white rounded-xl"><Send size={14}/></button>
                        </div>
                    </div>
                    )}
                </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    
        </script>
    </body>
</html>
